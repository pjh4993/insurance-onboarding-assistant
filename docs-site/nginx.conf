server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Behind the TLS-terminating ALB: redirects must stay relative, or nginx writes http:// into Location.
    absolute_redirect off;

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /docs/assets/ {
        expires 7d;
    }

    error_page 404 /docs/404.html;
}
