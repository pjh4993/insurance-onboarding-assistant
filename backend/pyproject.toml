[project]
name = "onboarding-backend"
version = "0.1.0"
description = "AI customer onboarding & policy recommendation assistant (FastAPI + LangGraph)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "onboarding-core",
    "onboarding-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-botocore>=0.65b0",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

# app/ is the API service; the agent and the domain are libraries it depends on.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
onboarding-core = { workspace = true }
onboarding-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/core/tests", "packages/agent/tests"]
# Each package keeps its own tests/ (no __init__.py), so modules are imported by path, not package name.
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"
src = [".", "packages/core/src", "packages/agent/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"packages/core/src/onboarding_core/catalog/seed.py" = ["E501"]
