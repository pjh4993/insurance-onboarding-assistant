[project]
name = "onboarding-agent"
version = "0.1.0"
description = "LangGraph onboarding agent: graph, nodes, LLM access and the encrypted checkpointer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "onboarding-core",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-aws>=0.2.20",
    "psycopg[binary,pool]>=3.2",
    "pycryptodome>=3.21",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[tool.uv.sources]
onboarding-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
