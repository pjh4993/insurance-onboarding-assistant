<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" role="img" aria-label="System context: customers, support agents and operators use the onboarding assistant, which calls the partner system, the identity provider, the contract admin system and Amazon Bedrock." style="width:100%;height:auto;max-width:1010px;display:block;margin:0 auto" font-family="inherit"><style>svg{color:#1f2328;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><marker id="sa2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="1"/></marker><marker id="sa2-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="0.5"/></marker><marker id="sa2-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706" fill-opacity="1"/></marker><marker id="sa2-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669" fill-opacity="1"/></marker></defs><text x="505.0" y="24" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="0.6" font-weight="700">Who uses the system and what it talks to</text><line x1="8" y1="34" x2="1002" y2="34" stroke="currentColor" stroke-opacity="0.15"/><rect x="20" y="80" width="180" height="62" rx="31.0" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="110.0" y="108.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Customer</text><text x="110.0" y="125.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(no account, session link)</text><rect x="20" y="205" width="180" height="62" rx="31.0" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="110.0" y="233.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Support agent</text><text x="110.0" y="250.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(staff account)</text><rect x="20" y="330" width="180" height="62" rx="31.0" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="110.0" y="358.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Operator</text><text x="110.0" y="375.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(staff, operators group)</text><rect x="360" y="44" width="210" height="382" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="372" y="62" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">Onboarding assistant</text><rect x="380" y="70" width="170" height="336" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="465.0" y="243.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Frontend + Backend</text><rect x="800" y="74" width="190" height="58" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="5 4"/><text x="895.0" y="100.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Partner system</text><text x="895.0" y="117.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">purchase records</text><line x1="552" y1="103" x2="798" y2="103" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#sa2-a)"/><text x="675.0" y="81" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">match customer, read purchases</text><text x="675.0" y="95" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">(only with consent)</text><rect x="800" y="164" width="190" height="58" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="5 4"/><text x="895.0" y="190.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Identity provider</text><text x="895.0" y="207.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">OTP + ID document check</text><line x1="552" y1="193" x2="798" y2="193" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#sa2-a)"/><text x="675.0" y="185" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">send / verify OTP, verify document</text><rect x="800" y="254" width="190" height="58" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="5 4"/><text x="895.0" y="280.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Contract admin system</text><text x="895.0" y="297.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">receives applications</text><line x1="552" y1="283" x2="798" y2="283" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#sa2-a)"/><text x="675.0" y="275" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">submit application</text><rect x="800" y="344" width="190" height="58" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="5 4"/><text x="895.0" y="370.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Amazon Bedrock</text><text x="895.0" y="387.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">Claude Sonnet 4.6</text><line x1="552" y1="373" x2="798" y2="373" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#sa2-a)"/><text x="675.0" y="365" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">extract, explain, summarize</text><line x1="202" y1="111" x2="378" y2="111" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#sa2-a)"/><text x="290.0" y="103" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">onboards through chat</text><line x1="202" y1="236" x2="378" y2="236" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#sa2-a)"/><text x="290.0" y="214" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">watches sessions,</text><text x="290.0" y="228" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">takes over</text><line x1="202" y1="361" x2="378" y2="361" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#sa2-a)"/><text x="290.0" y="339" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">maintains prompts,</text><text x="290.0" y="353" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">models and copy</text><rect x="20" y="442" width="22" height="14" rx="4" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6"/><text x="50" y="453.5" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">Built in this repo</text><rect x="196.8" y="442" width="22" height="14" rx="4" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="4 3"/><text x="226.8" y="453.5" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">External system</text></svg>
