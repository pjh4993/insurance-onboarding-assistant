<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 370" role="img" aria-label="The four stages of the onboarding graph in order, the CHANGE loop back to profiling, the DECLINE exit, and the human handoff every stage can fall into and resume from" style="width:100%;height:auto;max-width:1240px;display:block;margin:0 auto" font-family="inherit"><style>svg{color:#1f2328;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><marker id="lg0-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="1"/></marker><marker id="lg0-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="0.5"/></marker><marker id="lg0-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706" fill-opacity="1"/></marker><marker id="lg0-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669" fill-opacity="1"/></marker></defs><rect x="110" y="100" width="190" height="84" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="205.0" y="122" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.5" font-weight="700">STAGE 1</text><text x="205.0" y="142" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="1" font-weight="650">Identity verification</text><text x="205.0" y="160" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="400">intake, forms, then checks</text><text x="205.0" y="175" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="400">ends when verified</text><rect x="360" y="100" width="190" height="84" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="455.0" y="122" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.5" font-weight="700">STAGE 2</text><text x="455.0" y="142" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="1" font-weight="650">Customer profiling</text><text x="455.0" y="160" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="400">LLM reads, code finds gaps</text><text x="455.0" y="175" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="400">ends when nothing is missing</text><rect x="610" y="100" width="190" height="84" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="705.0" y="122" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.5" font-weight="700">STAGE 3</text><text x="705.0" y="142" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="1" font-weight="650">Policy recommendation</text><text x="705.0" y="160" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="400">code ranks and prices</text><text x="705.0" y="175" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="400">LLM explains, customer picks</text><rect x="860" y="100" width="190" height="84" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="955.0" y="122" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.5" font-weight="700">STAGE 4</text><text x="955.0" y="142" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="1" font-weight="650">Policy application</text><text x="955.0" y="160" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="400">parties, answers, summary</text><text x="955.0" y="175" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="400">ends when submitted</text><rect x="10" y="128.0" width="70" height="28" rx="14.0" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/><text x="45.0" y="146.5" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">start</text><path d="M80 142.0 L110 142.0" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><path d="M300 142.0 L360 142.0" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="330.0" y="135.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.8" font-weight="400">verified</text><path d="M550 142.0 L610 142.0" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="580.0" y="135.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.8" font-weight="400">complete</text><path d="M800 142.0 L860 142.0" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="830.0" y="135.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.8" font-weight="400">ACCEPT</text><path d="M1050 142.0 L1100 142.0" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="1075" y="135.0" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.8" font-weight="400">submit</text><rect x="1100" y="128.0" width="130" height="28" rx="14.0" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/><text x="1165.0" y="146.5" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">stop: SUBMITTED</text><path d="M665.0 100 L665.0 70 L515.0 70 L515.0 100" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="590.0" y="64" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.8" font-weight="400">CHANGE: redo needs</text><path d="M755.0 100 L755.0 48" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="763.0" y="80" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">DECLINE</text><rect x="690.0" y="20" width="130" height="28" rx="14.0" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/><text x="755.0" y="38.5" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">stop: DECLINED</text><rect x="110" y="290" width="940" height="60" rx="6" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.6" stroke-opacity="0.9"/><text x="580.0" y="317.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Human handoff</text><text x="580.0" y="334.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">human_handoff, then await_agent: a support agent resolves and the session resumes, or ends. Also reached from any node whose retries ran out</text><path d="M175.0 184 L175.0 290" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="167.0" y="232" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">identity</text><text x="167.0" y="246" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">failed twice</text><path d="M235.0 290 L235.0 184" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lg0-a)"/><text x="243.0" y="240" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">resume</text><path d="M425.0 184 L425.0 290" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="417.0" y="232" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">3 rounds,</text><text x="417.0" y="246" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">still missing</text><path d="M485.0 290 L485.0 184" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lg0-a)"/><text x="493.0" y="240" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">resume</text><path d="M675.0 184 L675.0 290" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="667.0" y="232" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">no eligible</text><text x="667.0" y="246" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">product</text><path d="M735.0 290 L735.0 184" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lg0-a)"/><text x="743.0" y="240" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">resume</text><path d="M925.0 184 L925.0 290" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="917.0" y="232" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">3 rounds or</text><text x="917.0" y="246" font-size="11" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">3 rejections</text><path d="M985.0 290 L985.0 184" fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#lg0-a)"/><text x="993.0" y="240" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">resume</text><path d="M1050 320 L1100 320" fill="none" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#lg0-a)"/><text x="1075" y="313" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity="0.8" font-weight="400">END</text><rect x="1100" y="306" width="130" height="28" rx="14.0" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.4"/><text x="1165.0" y="324.5" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">stop: WITHDRAWN</text></svg>
