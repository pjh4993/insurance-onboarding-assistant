<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-label="Where a session's data lives: the screens talk to the session runtime; the runtime resumes the graph and copies a summary into the OnboardingSession row; the graph saves its state to the encrypted checkpoint after every node, writes entities to the domain DB, reads the catalog and calls the identity system" style="width:100%;height:auto;max-width:1100px;display:block;margin:0 auto" font-family="inherit"><style>svg{color:#1f2328;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><marker id="st0-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="1"/></marker><marker id="st0-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="0.5"/></marker><marker id="st0-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706" fill-opacity="1"/></marker><marker id="st0-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669" fill-opacity="1"/></marker></defs><rect x="30" y="30" width="250" height="64" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="155.0" y="59.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Customer and agent screens</text><text x="155.0" y="76.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">send inputs; read the session and SSE</text><rect x="30" y="170" width="250" height="76" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="155.0" y="197.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Session runtime (API)</text><text x="155.0" y="214.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">one turn per input, under a lock</text><text x="155.0" y="229.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">mirrors progress after each turn</text><rect x="420" y="170" width="300" height="76" rx="6" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.6" stroke-opacity="0.9"/><text x="570.0" y="197.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Onboarding graph</text><text x="570.0" y="214.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">one thread per session</text><text x="570.0" y="229.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">nodes read the state and return updates</text><rect x="860" y="170" width="210" height="76" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="5 4"/><text x="965.0" y="197.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Identity system</text><text x="965.0" y="214.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">holds the OTP request</text><text x="965.0" y="229.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(external)</text><rect x="30" y="320" width="250" height="70" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="155.0" y="344.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >OnboardingSession row</text><text x="155.0" y="361.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">domain schema</text><text x="155.0" y="376.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">stage, waiting_for, status</text><rect x="320" y="320" width="230" height="70" rx="6" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.6" stroke-opacity="0.9"/><text x="435.0" y="344.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Checkpoint</text><text x="435.0" y="361.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">checkpoint schema</text><text x="435.0" y="376.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">OnboardingState, AES-encrypted</text><rect x="590" y="320" width="230" height="70" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="705.0" y="344.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Domain DB</text><text x="705.0" y="361.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">domain schema</text><text x="705.0" y="376.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">entity values: Party, Quote, ...</text><rect x="860" y="320" width="210" height="70" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="965.0" y="344.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Catalog</text><text x="965.0" y="361.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">catalog schema</text><text x="965.0" y="376.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">products and rules, read-only</text><line x1="155" y1="96" x2="155" y2="168" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st0-a)" marker-start="url(#st0-a)"/><text x="165" y="136" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.75">inputs  /  SSE events</text><line x1="282" y1="208" x2="418" y2="208" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st0-a)"/><text x="350.0" y="201.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">resume(input)</text><line x1="155" y1="248" x2="155" y2="318" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st0-a)"/><text x="165" y="278" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.75">summary after</text><text x="165" y="292" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.75">each turn</text><line x1="470" y1="248" x2="435" y2="318" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st0-a)"/><text x="445" y="278" font-size="11.5" text-anchor="end" fill="currentColor" fill-opacity="0.75">saved after</text><text x="445" y="292" font-size="11.5" text-anchor="end" fill="currentColor" fill-opacity="0.75">every node</text><line x1="630" y1="248" x2="690" y2="318" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st0-a)"/><text x="668" y="278" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.75">entities,</text><text x="668" y="292" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.75">through ports</text><line x1="710" y1="248" x2="930" y2="318" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#st0-a)"/><text x="830" y="278" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.75">reads</text><line x1="722" y1="208" x2="858" y2="208" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st0-a)"/><text x="790.0" y="201.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.75">checks, OTP</text></svg>
