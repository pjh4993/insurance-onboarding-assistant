<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 548" role="img" aria-label="OnboardingState is composed of one TypedDict per domain. Each lists its entity references (ids into the domain DB), routing signals, loop guards and transient inputs; the conversation part also holds the session context and progress" style="width:100%;height:auto;max-width:940px;display:block;margin:0 auto" font-family="inherit"><style>svg{color:#1f2328;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><marker id="st2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="1"/></marker><marker id="st2-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="0.5"/></marker><marker id="st2-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706" fill-opacity="1"/></marker><marker id="st2-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669" fill-opacity="1"/></marker></defs><rect x="10" y="10" width="920" height="528" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="22" y="28" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">OnboardingState: one TypedDict per domain that writes the fields</text><rect x="30" y="44" width="280" height="274" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.4"/><text x="42" y="64" font-size="13" text-anchor="start" fill="currentColor" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ConversationState</text><text x="42"