sient</text><text x="352" y="370" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">needs_input  {topic, fields, text}</text><rect x="330" y="400" width="280" height="130" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.4"/><text x="342" y="420" font-size="13" text-anchor="start" fill="currentColor" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">RecommendationState</text><text x="342" y="436" font-size="10.5" text-anchor="start" fill="currentColor" fill-opacity="0.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ids</text><text x="352" y="452" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">recommendation_ids  → Recommendation</text><text x="352" y="468" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">quote_ids  → Quote</text><text x="342" y="484" font-size="10.5" text-anchor="start" fill="currentColor" fill-opacity="0.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">signals</text><text x="352" y="500" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">eligible_count</text><text x="352" y="516" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">decision</text><rect x="630" y="44" width="280" height="194" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.4"/><text x="642" y="64" font-size="13" text-anchor="start" fill="currentColor" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ApplicationState</text><text x="642" y="80" font-size="10.5