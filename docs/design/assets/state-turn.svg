<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 624" role="img" aria-label="One turn: the screen posts an input; the runtime marks the session as processing and resumes the graph; each node reads and writes entities and returns an update that is merged and checkpointed; edges read routing signals until the graph waits again; the runtime then copies the new stage and wait into the session row and publishes SSE events" style="width:100%;height:auto;max-width:1170px;display:block;margin:0 auto" font-family="inherit"><style>svg{color:#1f2328;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><defs><marker id="st3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="1"/></marker><marker id="st3-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="0.5"/></marker><marker id="st3-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706" fill-opacity="1"/></marker><marker id="st3-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669" fill-opacity="1"/></marker></defs><rect x="15" y="20" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="100.0" y="45.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Screen</text><line x1="100" y1="60" x2="100" y2="614" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 4"/><rect x="245" y="20" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="330.0" y="45.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Session runtime</text><line x1="330" y1="60" x2="330" y2="614" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 4"/><rect x="495" y="20" width="170" height="40" rx="6" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.6" stroke-opacity="0.9"/><text x="580.0" y="45.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Graph</text><line x1="580" y1="60" x2="580" y2="614" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 4"/><rect x="765" y="20" width="170" height="40" rx="6" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.6" stroke-opacity="0.9"/><text x="850.0" y="45.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Checkpoint</text><line x1="850" y1="60" x2="850" y2="614" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 4"/><rect x="985" y="20" width="170" height="40" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="1070.0" y="45.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Domain DB</text><line x1="1070" y1="60" x2="1070" y2="614" stroke="currentColor" stroke-opacity="0.25" stroke-dasharray="4 4"/><rect x="410" y="258" width="730" height="222" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="422" y="276" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">per node, until the graph waits for a person</text><line x1="100" y1="96" x2="330" y2="96" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st3-a)"/><circle cx="116" cy="82" r="9" fill="#d97706"/><text x="116" y="86" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">1</text><text x="132" y="87" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">input (must match waiting_for)</text><line x1="330" y1="136" x2="1070" y2="136" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st3-a)"/><circle cx="346" cy="122" r="9" fill="#d97706"/><text x="346" y="126" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">2</text><text x="362" y="127" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">session row: waiting_for = null (processing)</text><line x1="330" y1="176" x2="580" y2="176" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st3-a)"/><circle cx="346" cy="162" r="9" fill="#d97706"/><text x="346" y="166" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">3</text><text x="362" y="167" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">resume + actor, mode, locale</text><rect x="594" y="194" width="252" height="48" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="610" cy="210" r="9" fill="#d97706"/><text x="610" y="214" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">4</text><text x="626" y="214" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.85" font-weight="400">ask_customer returns the input:</text><text x="626" y="229" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.85" font-weight="400">last_input, otp_code / needs_input</text><line x1="580" y1="316" x2="1070" y2="316" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st3-a)"/><circle cx="596" cy="302" r="9" fill="#d97706"/><text x="596" y="306" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">5</text><text x="612" y="307" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">read and write entities (deterministic ids, upsert)</text><line x1="580" y1="356" x2="850" y2="356" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st3-a)"/><circle cx="596" cy="342" r="9" fill="#d97706"/><text x="596" y="346" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">6</text><text x="612" y="347" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">update merged, then saved (gzip, AES)</text><line x1="580" y1="396" x2="100" y2="396" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#st3-a)"/><circle cx="564" cy="382" r="9" fill="#d97706"/><text x="564" y="386" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">7</text><text x="548" y="387" font-size="11.5" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">new messages, streamed as SSE message.appended</text><rect x="594" y="414" width="252" height="48" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.3"/><circle cx="610" cy="430" r="9" fill="#d97706"/><text x="610" y="434" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">8</text><text x="626" y="434" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.85" font-weight="400">edge reads routing signals only:</text><text x="626" y="449" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.85" font-weight="400">next node, or an interrupt (waiting_for)</text><line x1="330" y1="520" x2="850" y2="520" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st3-a)"/><circle cx="346" cy="506" r="9" fill="#d97706"/><text x="346" y="510" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">9</text><text x="362" y="511" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">snapshot: stage, waiting_for, next node</text><line x1="330" y1="560" x2="1070" y2="560" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st3-a)"/><circle cx="346" cy="546" r="9" fill="#d97706"/><text x="346" y="550" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">10</text><text x="362" y="551" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.8" font-weight="400">session row: last_stage, waiting_for, current_node, status</text><line x1="330" y1="600" x2="100" y2="600" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#st3-a)"/><circle cx="314" cy="586" r="9" fill="#d97706"/><text x="314" y="590" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">11</text><text x="298" y="591" font-size="11.5" text-anchor="end" fill="currentColor" fill-opacity="0.8" font-weight="400">SSE session.updated, prompt.updated</text></svg>
