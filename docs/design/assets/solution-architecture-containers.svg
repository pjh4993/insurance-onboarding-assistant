harray="7 5"/><text x="132" y="128" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">Frontend service (Next.js)</text><rect x="160" y="145" width="200" height="56" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="260.0" y="170.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Customer app</text><text x="260.0" y="187.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">/s/*</text><rect x="480" y="145" width="200" height="56" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="580.0" y="170.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Agent console</text><text x="580.0" y="187.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">/agent/*</text><rect x="340" y="236" width="240" height="56" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="460.0" y="261.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Route handlers</text><text x="460.0" y="278.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">/api/* (relay + SSE)</text><rect x="770" y="130" width="210" height="86" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="5 4"/><text x="875.0" y="162.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Mock service</text><text x="875.0" y="179.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">/partner /identity /contract</text><text x="875.0" y="194.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">/model/{id}/converse</text><rect x="40" y="390" width="920" height="116" rx="9" fill="none" stroke="currentColor" stroke-opacity=