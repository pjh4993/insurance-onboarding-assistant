<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="CI/CD pipeline: pull requests and pushes to develop or main run ci.yml; a push to develop runs deploy-develop.yml; fast-forwarding main to that SHA, after approval, runs deploy-prod.yml with the same image." style="width:100%;height:auto;max-width:960px;display:block;margin:0 auto" font-family="inherit"><style>svg{color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{color:#e6edf3}}</style><defs><marker id="cd1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="1"/></marker><marker id="cd1-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="0.5"/></marker><marker id="cd1-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706" fill-opacity="1"/></marker><marker id="cd1-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669" fill-opacity="1"/></marker></defs><rect x="20" y="20" width="150" height="100" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="95.0" y="59.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Pull request</text><text x="95.0" y="76.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">or push to</text><text x="95.0" y="91.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">develop / main</text><rect x="230" y="20" width="200" height="100" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="330.0" y="51.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ci.yml</text><text x="330.0" y="68.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">lint, test, build,</text><text x="330.0" y="83.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">terraform fmt/validate,</text><text x="330.0" y="98.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">docker build</text><rect x="20" y="170" width="150" height="100" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="95.0" y="225.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Push to develop</text><rect x="220" y="170" width="200" height="100" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="320.0" y="193.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">deploy-develop.yml</text><text x="320.0" y="210.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">push images (tag = SHA)</text><text x="320.0" y="225.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">terraform apply develop</text><text x="320.0" y="240.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">wait for ECS</text><text x="320.0" y="255.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">smoke test</text><rect x="470" y="170" width="230" height="100" rx="6" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.6" stroke-opacity="0.9"/><text x="585.0" y="209.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Fast-forward main</text><text x="585.0" y="226.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">to that SHA</text><text x="585.0" y="241.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">+ approval (Environment: prod)</text><rect x="750" y="170" width="190" height="100" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="845.0" y="193.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">deploy-prod.yml</text><text x="845.0" y="210.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">same image SHA</text><text x="845.0" y="225.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">terraform apply prod</text><text x="845.0" y="240.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">wait for ECS</text><text x="845.0" y="255.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">smoke test</text><line x1="170" y1="70" x2="228" y2="70" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#cd1-a)"/><line x1="170" y1="220" x2="218" y2="220" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#cd1-a)"/><line x1="420" y1="220" x2="468" y2="220" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#cd1-a)"/><line x1="700" y1="220" x2="748" y2="220" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#cd1-a)"/><rect x="20" y="300" width="22" height="14" rx="4" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6"/><text x="50" y="311.5" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.8">GitHub Actions workflow</text><rect x="230" y="300" width="22" height="14" rx="4" fill="#d97706" fill-opacity="0.14" stroke="#d97706" stroke-width="1.6"/><text x="260" y="311.5" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.8">manual step</text></svg>
