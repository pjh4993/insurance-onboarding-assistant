<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 190" role="img" aria-label="Security boundaries: browser on the internet, ALB with Cognito at the edge, frontend and backend in private subnets, RDS in a data boundary with no internet; each hop is only reachable from the one before it." style="width:100%;height:auto;max-width:1030px;display:block;margin:0 auto" font-family="inherit"><style>svg{color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{color:#e6edf3}}</style><defs><marker id="nw3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="1"/></marker><marker id="nw3-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" fill-opacity="0.5"/></marker><marker id="nw3-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706" fill-opacity="1"/></marker><marker id="nw3-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669" fill-opacity="1"/></marker></defs><rect x="20" y="30" width="130" height="140" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="32" y="48" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">Internet</text><rect x="35" y="84" width="100" height="50" rx="25" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45" stroke-dasharray="5 4"/><text x="85.0" y="114.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Browser</text><rect x="186" y="30" width="182" height="140" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="198" y="48" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">Edge boundary</text><rect x="202" y="78" width="150" height="62" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="277.0" y="106.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >ALB + Cognito</text><text x="277.0" y="123.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">(agents)</text><rect x="404" y="30" width="382" height="140" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="416" y="48" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">App boundary (private subnets)</text><rect x="420" y="78" width="160" height="62" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="500.0" y="98.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Frontend</text><text x="500.0" y="115.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">attaches caller</text><text x="500.0" y="130.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">identity</text><rect x="610" y="78" width="160" height="62" rx="6" fill="#059669" fill-opacity="0.14" stroke="#059669" stroke-width="1.6" stroke-opacity="0.9"/><text x="690.0" y="98.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >Backend</text><text x="690.0" y="115.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">only reachable</text><text x="690.0" y="130.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">from frontend</text><rect x="822" y="30" width="188" height="140" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="834" y="48" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">Data boundary (no internet)</text><rect x="838" y="78" width="156" height="62" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="916.0" y="98.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" >RDS</text><text x="916.0" y="115.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">only reachable</text><text x="916.0" y="130.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">from backend</text><line x1="135" y1="109.0" x2="200" y2="109.0" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#nw3-a)"/><line x1="352" y1="109.0" x2="418" y2="109.0" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#nw3-a)"/><line x1="580" y1="109.0" x2="608" y2="109.0" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#nw3-a)"/><line x1="770" y1="109.0" x2="836" y2="109.0" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#nw3-a)"/></svg>
