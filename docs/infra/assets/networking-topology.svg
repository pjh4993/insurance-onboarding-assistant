" stroke-width="1.4" stroke-dasharray="7 5"/><text x="52" y="138" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">Public tier</text><rect x="60" y="152" width="290" height="54" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="205.0" y="176.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10.0.0.0/24 (2a)</text><text x="205.0" y="193.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">ALB, NAT</text><rect x="370" y="152" width="290" height="54" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="515.0" y="176.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10.0.1.0/24 (2c)</text><text x="515.0" y="193.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">ALB, NAT (prod)</text><rect x="40" y="260" width="640" height="100" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="52" y="278" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">Private app tier</text><rect x="60" y="292" width="290" height="54" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="205.0" y="316.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10.0.10.0/24 (2a)</text><text x="205.0" y="333.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">ECS tasks, interface endpoints</text><rect x="370" y="292" width="290" height="54" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="515.0" y="316.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10.0.11.0/24 (2c)</text><text x="515.0" y="333.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">ECS tasks, interface endpoints (prod)</text><rect x="40" y="400" width="640" height="100" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="7 5"/><text x="52" y="418" font-size="12" text-anchor="start" fill="currentColor" fill-opacity="0.95" font-weight="700">Private data tier</text><rect x="60" y="432" width="290" height="54" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="205.0" y="456.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10.0.20.0/24 (2a)</text><text x="205.0" y="473.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">RDS</text><rect x="370" y="432" width="290" height="54" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="1.6" stroke-opacity="0.45"/><text x="515.0" y="456.0" font-size="14" text-anchor="middle" fill="currentColor" font-weight="650" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10.0.21.0/24 (2c)</text><text x="515.0" y="473.0" font-size="11.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">RDS standby (prod)</text><line x1="360" y1="66" x2="360" y2="118" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#nw1-a)" marker-start="url(#nw1-a)"/><line x1="360" y1="258" x2="360" y2="222" stroke="currentColor" stroke-opacity="0.8" stroke-width="1.5" marker-end="url(#nw1-a)"/><text x="370" y="244" font-size="11.5" text-anchor="start" fill="currentColor" fill-opacity="0.75">outbound via NAT</text><line x1="360"