site_name: Onboarding Assistant
site_description: AI customer onboarding and policy recommendation assistant — design documents.
repo_url: https://github.com/pjh4993/bolttech-onboarding-assistant
edit_uri: ""

# Built from the repo root so every relative link resolves the same here and on GitHub.
# Only the README, the contracts and docs/ are site content; code stays out.
docs_dir: .
site_dir: .site

exclude_docs: |
  /*
  !/README.md
  !/CONTRACTS.md
  !/docs/
  !/contracts/

plugins:
  - same-dir
  - awesome-nav
  - search

hooks:
  - .mkdocs/hooks.py

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # GitHub renders the same fence, so a diagram reads in both places.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
