site_name: Onboarding Assistant
site_description: AI customer onboarding and policy recommendation assistant — design documents.
repo_url: https://github.com/pjh4993/bolttech-onboarding-assistant
edit_uri: ""

# Built from the repo root so every relative link resolves the same here and on GitHub.
# Only the README, the contracts and docs/ are site content; code stays out.
docs_dir: .
site_dir: .site

exclude_docs: |
  /*
  !/README.md
  !/CONTRACTS.md
  !/docs/
  !/contracts/
  # The theme's CSS, JS and fonts are collected as files at assets/; the /* above would drop them.
  !/assets/

plugins:
  - same-dir
  - awesome-nav
  - search
  # Screenshots open full size. SVG diagrams are inlined by the hook instead (glightbox only opens <img>).
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      draggable: true
      auto_caption: true
      caption_position: bottom

hooks:
  - .mkdocs/hooks.py

# Same look as the ai-interview-assignments site: Material with the Hugging Face docs palette and type.
theme:
  name: material
  language: en
  font:
    text: Source Sans 3
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Paths are site URLs: the hook publishes docs/ at the site root, so docs/assets/ is served at assets/.
extra_css:
  - assets/huggingface.css
  - assets/svg-zoom.css
  - assets/diagrams.css

# Inline SVG diagrams zoom on click. glightbox cannot: it only opens <img>.
extra_javascript:
  - assets/svg-zoom.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # GitHub renders the same fence, so a diagram reads in both places.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
